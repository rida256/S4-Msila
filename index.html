<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع قيد التحديث</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #e0e0e0;
            line-height: 1.6;
        }

        /* حاوية الفيديو لجعل التضمين متجاوباً وأنيقاً */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* نسبة أبعاد الفيديو 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* حركات تجميلية */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* التوافق مع الشاشات الصغيرة */
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            p { font-size: 0.95rem; }
            .container { padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- أيقونة تعبيرية -->
        <div class="icon">🛠️</div>
        
        <h1>عذرًا، الموقع مؤقتًا خارج الخدمة</h1>
        
        <p>نعمل حاليًا على إجراء بعض التحسينات والتحديثات لنقدم لكم تجربة أفضل. سنعود إليكم في أقرب وقت ممكن!</p>
        
        <!-- تضمين فيديو يوتيوب بشكل متجاوب -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/j31DOUlaYz4" 
                title="وإلى هنا تنتهي سهرتنا" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
